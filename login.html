<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Levi's</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="login">
  <header class="cabecera">
  <div class="marca">
    <span class="logo">LEVI'S</span>
    <span class="lema">Tienda en línea</span>
  </div>
  <div class="alumna">
    <strong>Lia Bretado Quiroz</strong>
    <span>Grupo 5-J</span>
  </div>
</header>
  <main class="angosto">
    <section class="tarjeta">
      <h2>Iniciar sesión</h2>
      <p id="aviso" class="aviso" hidden></p>
      <form id="formulario">
        <label for="correo">Correo</label>
        <input id="correo" type="email" required>
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" required>
        <button class="boton" type="submit">Entrar</button>
      </form>
      <p class="tenue">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>
  <script src="js/demo.js"></script>
</body>
</html>
